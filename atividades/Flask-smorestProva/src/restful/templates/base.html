<!DOCTYPE html>
<html lang="{{ get_locale() }}">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %} - {{ _('Site Multilíngue') }}</title>
    <script>
        window.appTranslations = {{ {
            "nameRequired": _("O nome é obrigatório."),
            "minimumValue": _("Valor mínimo: 0"),
            "itemCreated": _('Item "%(name)s" cadastrado com sucesso!', name="__ITEM_NAME__"),
            "registerError": _("Erro ao cadastrar."),
            "connectionError": _("Erro de conexão."),
            "searchMinLength": _("Digite ao menos 3 letras."),
            "confirmDelete": _("Tem certeza que deseja excluir este item?"),
            "deleteError": _("Erro ao deletar."),
            "itemUpdated": _("Item atualizado com sucesso."),
            "updateError": _("Erro ao atualizar."),
            "updateConnectionError": _("Erro de conexão ao atualizar o item.")
        } | tojson }};
    </script>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; line-height: 1.6; }
        nav { margin-bottom: 20px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
        nav a { margin-right: 15px; text-decoration: none; color: #0066cc; }
        .lang-switch { float: right; }
        .lang-switch a { font-weight: bold; }
    </style>
</head>
<body>
    <nav>
        <a href="{{ url_for('pagina_cadastro') }}">{{ _('Cadastro') }}</a>
        <a href="{{ url_for('pagina_consulta') }}">{{ _('Consulta') }}</a>

        <span class="lang-switch">
            🌐 {{ _('Idioma') }}:
            <a href="{{ url_for('mudar_idioma', lang='pt') }}">PT</a> |
            <a href="{{ url_for('mudar_idioma', lang='en') }}">EN</a> |
            <a href="{{ url_for('mudar_idioma', lang='ru') }}">RU</a>
        </span>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
