<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Itens</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 480px; margin: 40px auto; }
    label { display: block; margin-top: 12px; font-weight: bold; }
    input[type="text"], input[type="number"] {
      width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box;
    }
    button { margin-top: 16px; padding: 10px 20px; cursor: pointer; }
    .msg { margin-top: 12px; padding: 8px; border-radius: 4px; }
    .ok  { background: #d4edda; color: #155724; }
    .err { background: #f8d7da; color: #721c24; }
    a { display: inline-block; margin-top: 20px; }
    .erro-campo { color: #721c24; font-size: 0.9em; }
  </style>
</head>
<body>
  <h2>Cadastrar Item</h2>

  <form id="form-cadastro" method="post" novalidate>
    {{ form.hidden_tag() }}

    <label>{{ form.nome.label.text }}</label>
    {{ form.nome(id="nome") }}
    <div class="erro-campo" id="erro-nome"></div>

    <label>{{ form.quantidade.label.text }}</label>
    {{ form.quantidade(id="quantidade") }}
    <div class="erro-campo" id="erro-quantidade"></div>

    <label>{{ form.valor.label.text }}</label>
    {{ form.valor(id="valor") }}
    <div class="erro-campo" id="erro-valor"></div>

    {{ form.submit(id="btn-cadastrar") }}
  </form>

  <div id="mensagem"></div>
  <a href="/consulta">Ir para Consulta →</a>

  <script>
    let formCadastro = document.getElementById("form-cadastro");

    formCadastro.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("mensagem");
      msg.textContent = "";
      msg.className = "msg";

      ["nome", "quantidade", "valor"].forEach(c => {
        document.getElementById("erro-" + c).textContent = "";
      });

      const nome = document.getElementById("nome").value.trim();
      const quantidade = document.getElementById("quantidade").value;
      const valor = document.getElementById("valor").value;

      /* ── Validação client-side espelhando WTForms ── */
      let valido = true;
      if (!nome) {
        document.getElementById("erro-nome").textContent = "O nome é obrigatório.";
        valido = false;
      }
      if (quantidade !== "" && Number(quantidade) < 0) {
        document.getElementById("erro-quantidade").textContent = "Valor mínimo: 0";
        valido = false;
      }
      if (valor !== "" && Number(valor) < 0) {
        document.getElementById("erro-valor").textContent = "Valor mínimo: 0";
        valido = false;
      }
      if (!valido) return;

      const body = {
        nome: nome,
        quantidade: quantidade === "" ? 0 : Number(quantidade),
        valor: valor === "" ? 0.0 : Number(valor)
      };

      try {
        const res = await fetch("/api/items", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body)
        });
        const data = await res.json();
        console.log(res);
        console.log(data);
        if (res.ok) {
          msg.className = "msg ok";
          msg.textContent = `Item "${data.nome}" cadastrado com sucesso!`;
          document.getElementById("form-cadastro").reset();
        } else {
          msg.className = "msg err";
          msg.textContent = data.erro || "Erro ao cadastrar.";
        }
      } catch (err) {
        msg.className = "msg err";
        msg.textContent = "Erro de conexão.";
      }
    });
  </script>
</body>
</html>
