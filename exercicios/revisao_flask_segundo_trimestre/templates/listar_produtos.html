{% extends "base.html" %}
{% block content %}

<h1>Lista dos Produtos</h1>

<div id="lista-produtos"></div>

<script>
    function escapeHTML(str) {
        const div = document.createElement('div');
        div.textContent = str ?? '';
        return div.innerHTML;
    }

    async function carregarItens() {
        const res = await fetch("/api/produtos");
        if (!res.ok) return;

        const items = await res.json();
        const container = document.getElementById("lista-produtos");
        container.innerHTML = "";

        items.forEach(produto => {
            const bloco = document.createElement("div");

            let html = `
                <h3>Marca: ${escapeHTML(produto.marca)}</h3>
                <p>Nome: ${escapeHTML(produto.nome)}</p>
                <p>Descrição: ${escapeHTML(produto.descricao)}</p>
            `;

            // só aparece se a API mandar esse campo
            if (produto.valor_custo !== undefined) {
                html += `<p>Valor de Custo: R$${produto.valor_custo}</p>`;
            }

            html += `
                <p>Valor de Venda: R$${produto.valor_venda}</p>
                <p>Peso: ${escapeHTML(produto.peso)}</p>
                <p>Quantidade: ${produto.quantidade}</p>
                <hr>
            `;

            bloco.innerHTML = html;
            container.appendChild(bloco);
        });
    }

    carregarItens();
</script>

{% endblock content %}
